global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: coldguard-api
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
  - job_name: coldguard-worker
    static_configs:
      - targets: ["worker:9101"]
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
  - job_name: containers           # container CPU / memory / health (Compose only; k8s uses the kubelet + kube-state-metrics)
    static_configs:
      - targets: ["container-exporter:9417"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
