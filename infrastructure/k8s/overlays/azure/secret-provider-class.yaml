# Azure Key Vault -> Secrets Store CSI driver -> Kubernetes Secret `coldguard-secrets`.
# Key Vault names cannot contain "_", so each object is mapped back to the env-var name the
# application expects. The synced Secret exists while at least one pod mounts this class
# (every pod that needs it does) and is rotated every 2 min (AKS add-on setting).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: coldguard-kv
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: placeholder        # workload identity (replaced from azure-params)
    keyvaultName: placeholder
    tenantId: placeholder
    objects: |
      array:
        - |
          objectName: database-url
          objectType: secret
        - |
          objectName: exporter-dsn
          objectType: secret
        - |
          objectName: postgres-user
          objectType: secret
        - |
          objectName: postgres-password
          objectType: secret
        - |
          objectName: secret-key
          objectType: secret
        - |
          objectName: ingest-api-key
          objectType: secret
        - |
          objectName: mqtt-password
          objectType: secret
        - |
          objectName: mqtt-ingestor-password
          objectType: secret
        - |
          objectName: mqtt-device-password
          objectType: secret
        - |
          objectName: grafana-admin-password
          objectType: secret
        - |
          objectName: applicationinsights-connection-string
          objectType: secret
  secretObjects:
    - secretName: coldguard-secrets
      type: Opaque
      data:
        - { objectName: database-url, key: DATABASE_URL }
        - { objectName: exporter-dsn, key: EXPORTER_DSN }
        - { objectName: postgres-user, key: POSTGRES_USER }
        - { objectName: postgres-password, key: POSTGRES_PASSWORD }
        - { objectName: secret-key, key: SECRET_KEY }
        - { objectName: ingest-api-key, key: INGEST_API_KEY }
        - { objectName: mqtt-password, key: MQTT_PASSWORD }
        - { objectName: mqtt-ingestor-password, key: MQTT_INGESTOR_PASSWORD }
        - { objectName: mqtt-device-password, key: MQTT_DEVICE_PASSWORD }
        - { objectName: grafana-admin-password, key: GRAFANA_ADMIN_PASSWORD }
        - { objectName: applicationinsights-connection-string, key: APPLICATIONINSIGHTS_CONNECTION_STRING }
