# Fallback ingress controller for LOCAL kind clusters (INGRESS_CONTROLLER=traefik in
# scripts/ci/k8s-deploy.sh). Use it when registry.k8s.io (ingress-nginx) is unreachable from
# your network; the image comes from Docker Hub. The base manifests and the production overlay
# keep ingressClassName nginx — the deploy script re-points the local Ingress to "traefik".
apiVersion: v1
kind: Namespace
metadata: { name: ingress-traefik }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: traefik, namespace: ingress-traefik }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: coldguard-traefik }
rules:
  - apiGroups: [""]
    resources: [services, endpoints, secrets, nodes]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [list, watch]
  - apiGroups: [networking.k8s.io, extensions]
    resources: [ingresses, ingressclasses]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io, extensions]
    resources: [ingresses/status]
    verbs: [update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: coldguard-traefik }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: coldguard-traefik }
subjects: [{ kind: ServiceAccount, name: traefik, namespace: ingress-traefik }]
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata: { name: traefik }
spec: { controller: traefik.io/ingress-controller }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: traefik, namespace: ingress-traefik }
spec:
  replicas: 1
  strategy: { type: Recreate }        # hostPort 80 can only be bound once per node
  selector: { matchLabels: { app.kubernetes.io/name: traefik } }
  template:
    metadata: { labels: { app.kubernetes.io/name: traefik } }
    spec:
      serviceAccountName: traefik
      nodeSelector: { ingress-ready: "true" }
      tolerations: [{ key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule }]
      containers:
        - name: traefik
          image: traefik:v3.3.4
          imagePullPolicy: IfNotPresent
          args:
            - --entryPoints.web.address=:80
            - --entryPoints.traefik.address=:9000
            - --ping=true
            - --ping.entryPoint=traefik
            - --providers.kubernetesingress=true
            - --providers.kubernetesingress.ingressClass=traefik
            - --log.level=WARN
          ports:
            - { name: web, containerPort: 80, hostPort: 80 }
            - { name: admin, containerPort: 9000 }
          readinessProbe: { httpGet: { path: /ping, port: admin }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /ping, port: admin }, periodSeconds: 15 }
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 500m, memory: 256Mi } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL], add: [NET_BIND_SERVICE] }
