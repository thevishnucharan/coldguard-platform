# Local cluster for ColdGuard:  kind create cluster --name coldguard --config infrastructure/k8s/kind/kind-config.yaml
# Host port 8088 -> ingress-nginx :80, so the UI is at http://coldguard.localhost:8088
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: coldguard
nodes:
  - role: control-plane
    image: kindest/node:v1.32.2
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - { containerPort: 80, hostPort: 8088, protocol: TCP }
