# Service isolation: deny all ingress by default, then allow only the required paths.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny-ingress }
spec: { podSelector: {}, policyTypes: [Ingress] }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: frontend-from-anywhere }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: frontend } }
  ingress: [{ ports: [{ port: 8080 }] }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: backend-from-frontend-and-prometheus }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: backend } }
  ingress:
    - from: [{ podSelector: { matchLabels: { app.kubernetes.io/name: frontend } } }, { podSelector: { matchLabels: { app.kubernetes.io/name: prometheus } } }]
      ports: [{ port: 8000 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: data-from-app }
spec:
  podSelector: { matchLabels: { tier: data } }
  ingress:
    - from:
        - podSelector: { matchLabels: { tier: app } }
        - podSelector: { matchLabels: { app.kubernetes.io/name: coldguard-migrate } }
        - podSelector: { matchLabels: { tier: monitoring } }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: mqtt-from-devices }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: mosquitto } }
  ingress: [{ ports: [{ port: 1883 }] }]   # devices/gateways connect from outside the namespace
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: monitoring-scrape }
spec:
  podSelector: { matchLabels: { tier: monitoring } }
  ingress: [{ from: [{ podSelector: { matchLabels: { tier: monitoring } } }] }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: worker-metrics-from-prometheus }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: worker } }
  ingress: [{ from: [{ podSelector: { matchLabels: { app.kubernetes.io/name: prometheus } } }], ports: [{ port: 9101 }] }]
