# Kubernetes variant of infrastructure/prometheus/prometheus.yml (Compose). Alerts and job names
# are identical so the same dashboards work in both; discovery differs:
#   * API / worker pods are discovered individually (a Service would load-balance scrapes
#     across replicas and make counters jump)
#   * container CPU / memory come from the kubelet's cAdvisor via the API server proxy
#   * kube-state-metrics provides restarts / readiness
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: coldguard-api
    kubernetes_sd_configs: [{ role: pod, namespaces: { names: [coldguard] } }]
    relabel_configs: &pod_relabel
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        regex: backend
        action: keep
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        regex: "true"
        action: keep
      - source_labels: [__meta_kubernetes_pod_phase]
        regex: Running
        action: keep
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        regex: '([^:]+)(?::\d+)?;(\d+)'
        replacement: $1:$2
        target_label: __address__
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
  - job_name: coldguard-worker
    kubernetes_sd_configs: [{ role: pod, namespaces: { names: [coldguard] } }]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        regex: worker
        action: keep
      - source_labels: [__meta_kubernetes_pod_phase]
        regex: Running
        action: keep
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        regex: '([^:]+)(?::\d+)?;(\d+)'
        replacement: $1:$2
        target_label: __address__
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
  - job_name: kube-state-metrics
    static_configs:
      - targets: ["kube-state-metrics:8080"]
  - job_name: kubernetes-cadvisor
    scheme: https
    tls_config: { ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt }
    authorization: { credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token }
    kubernetes_sd_configs: [{ role: node }]
    relabel_configs:
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        regex: (.+)
        target_label: __metrics_path__
        replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
    metric_relabel_configs:
      - source_labels: [namespace]
        regex: coldguard
        action: keep
      - source_labels: [__name__]
        regex: container_(cpu_usage_seconds_total|memory_working_set_bytes|last_seen|spec_memory_limit_bytes)
        action: keep
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
