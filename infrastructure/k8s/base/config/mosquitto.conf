# Eclipse Mosquitto — ColdGuard telemetry broker
# Authentication required; topic ACLs restrict devices to publishing telemetry only.
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# For production add a TLS listener (8883) with certificates mounted from a secret:
# listener 8883
# cafile /mosquitto/certs/ca.crt
# certfile /mosquitto/certs/server.crt
# keyfile /mosquitto/certs/server.key
