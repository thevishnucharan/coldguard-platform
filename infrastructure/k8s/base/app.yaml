# Application tier: migration Job, API (HPA), worker (single active scheduler), frontend (HPA).
apiVersion: batch/v1
kind: Job
metadata: { name: coldguard-migrate }
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata: { labels: { app.kubernetes.io/name: coldguard-migrate, app.kubernetes.io/part-of: coldguard } }
    spec:
      restartPolicy: OnFailure
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: migrate
          image: coldguard-backend:2.0.0
          command: ["sh", "-c", "python scripts/migrate.py && python scripts/seed.py"]
          envFrom: [{ configMapRef: { name: coldguard-config } }, { secretRef: { name: coldguard-secrets } }]
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: "1", memory: 768Mi } }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
---
apiVersion: v1
kind: Service
metadata: { name: backend, labels: { app.kubernetes.io/name: backend } }
spec:
  selector: { app.kubernetes.io/name: backend }
  ports: [{ name: http, port: 8000, targetPort: 8000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: backend }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app.kubernetes.io/name: backend } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: backend, app.kubernetes.io/part-of: coldguard, tier: app }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "8000", prometheus.io/path: /metrics }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      terminationGracePeriodSeconds: 40
      topologySpreadConstraints:
        - { maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway,
            labelSelector: { matchLabels: { app.kubernetes.io/name: backend } } }
      initContainers:
        - name: wait-for-migrations
          image: coldguard-backend:2.0.0
          command: ["python", "scripts/wait_for_migrations.py"]
          envFrom: [{ configMapRef: { name: coldguard-config } }, { secretRef: { name: coldguard-secrets } }]
          resources: { requests: { cpu: 20m, memory: 64Mi }, limits: { cpu: 200m, memory: 256Mi } }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
      containers:
        - name: api
          image: coldguard-backend:2.0.0
          args: ["api"]
          ports: [{ containerPort: 8000, name: http }]
          envFrom: [{ configMapRef: { name: coldguard-config } }, { secretRef: { name: coldguard-secrets } }]
          env:
            - { name: RUN_EMBEDDED_WORKER, value: "false" }
            - { name: MIGRATE_ON_START, value: "false" }
          startupProbe: { httpGet: { path: /health, port: http }, periodSeconds: 5, failureThreshold: 30 }
          livenessProbe: { httpGet: { path: /health, port: http }, periodSeconds: 15, timeoutSeconds: 3 }
          readinessProbe: { httpGet: { path: /ready, port: http }, periodSeconds: 10, timeoutSeconds: 3 }
          # let endpoints/ingress stop routing before uvicorn begins its graceful shutdown
          lifecycle: { preStop: { exec: { command: ["sh", "-c", "sleep 8"] } } }
          resources: { requests: { cpu: 200m, memory: 384Mi }, limits: { cpu: "1", memory: 768Mi } }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: backend }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: backend }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - { type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } } }
    - { type: Resource, resource: { name: memory, target: { type: Utilization, averageUtilization: 80 } } }
  # scale on sustained load, not on a pod's start-up CPU burst; at most +2 pods per minute
  behavior:
    scaleUp: { stabilizationWindowSeconds: 60, policies: [{ type: Pods, value: 2, periodSeconds: 60 }] }
    scaleDown: { stabilizationWindowSeconds: 300 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: backend }
spec: { minAvailable: 1, selector: { matchLabels: { app.kubernetes.io/name: backend } } }
---
apiVersion: v1
kind: Service
metadata: { name: worker, labels: { app.kubernetes.io/name: worker } }
spec:
  selector: { app.kubernetes.io/name: worker }
  ports: [{ name: metrics, port: 9101 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: worker }
spec:
  revisionHistoryLimit: 5
  replicas: 1                 # exactly one scheduler/MQTT consumer; Recreate avoids two active during rollout
  strategy: { type: Recreate }
  selector: { matchLabels: { app.kubernetes.io/name: worker } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: worker, app.kubernetes.io/part-of: coldguard, tier: app }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "9101" }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      initContainers:
        - name: wait-for-migrations
          image: coldguard-backend:2.0.0
          command: ["python", "scripts/wait_for_migrations.py"]
          envFrom: [{ configMapRef: { name: coldguard-config } }, { secretRef: { name: coldguard-secrets } }]
          resources: { requests: { cpu: 20m, memory: 64Mi }, limits: { cpu: 200m, memory: 256Mi } }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
      terminationGracePeriodSeconds: 30   # finish the current job cycle, disconnect MQTT cleanly
      containers:
        - name: worker
          image: coldguard-backend:2.0.0
          args: ["worker"]
          ports: [{ containerPort: 9101, name: metrics }]
          envFrom: [{ configMapRef: { name: coldguard-config } }, { secretRef: { name: coldguard-secrets } }]
          env: [{ name: RUN_EMBEDDED_WORKER, value: "false" }]
          livenessProbe: { httpGet: { path: /metrics, port: metrics }, periodSeconds: 20, initialDelaySeconds: 20 }
          readinessProbe: { httpGet: { path: /metrics, port: metrics }, periodSeconds: 10 }
          resources: { requests: { cpu: 100m, memory: 384Mi }, limits: { cpu: "1", memory: 768Mi } }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
---
apiVersion: v1
kind: Service
metadata: { name: frontend }
spec:
  selector: { app.kubernetes.io/name: frontend }
  ports: [{ name: http, port: 80, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: frontend }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app.kubernetes.io/name: frontend } }
  template:
    metadata: { labels: { app.kubernetes.io/name: frontend, app.kubernetes.io/part-of: coldguard, tier: web } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 101, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: nginx
          image: coldguard-frontend:2.0.0
          ports: [{ containerPort: 8080, name: http }]
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 15 }
          readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 5 }
          lifecycle: { preStop: { exec: { command: ["sh", "-c", "sleep 5"] } } }
          resources: { requests: { cpu: 20m, memory: 32Mi }, limits: { cpu: 300m, memory: 128Mi } }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: frontend }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: frontend }
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - { type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 75 } } }
    - { type: Resource, resource: { name: memory, target: { type: Utilization, averageUtilization: 80 } } }
  # scale on sustained load, not on a pod's start-up CPU burst; at most +2 pods per minute
  behavior:
    scaleUp: { stabilizationWindowSeconds: 60, policies: [{ type: Pods, value: 2, periodSeconds: 60 }] }
    scaleDown: { stabilizationWindowSeconds: 300 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: frontend }
spec: { minAvailable: 1, selector: { matchLabels: { app.kubernetes.io/name: frontend } } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: coldguard
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"   # WebSockets
    nginx.ingress.kubernetes.io/proxy-body-size: 2m
spec:
  ingressClassName: nginx
  rules:
    - host: coldguard.local
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: frontend, port: { number: 80 } } } }
