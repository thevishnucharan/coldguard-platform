# Observability: Prometheus (same config/alerts as Compose), Grafana (provisioned dashboards),
# postgres/redis exporters. Clusters with kube-prometheus-stack can drop this file and use
# the pod prometheus.io/* annotations or ServiceMonitors instead.
apiVersion: v1
kind: Service
metadata: { name: prometheus }
spec: { selector: { app.kubernetes.io/name: prometheus }, ports: [{ port: 9090 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: prometheus }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: prometheus } }
  template:
    metadata: { labels: { app.kubernetes.io/name: prometheus, app.kubernetes.io/part-of: coldguard, tier: monitoring } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 65534, fsGroup: 65534 }
      containers:
        - name: prometheus
          image: prom/prometheus:v3.1.0
          args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
          ports: [{ containerPort: 9090 }]
          readinessProbe: { httpGet: { path: /-/ready, port: 9090 }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /-/healthy, port: 9090 }, periodSeconds: 20 }
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } }
          volumeMounts: [{ name: config, mountPath: /etc/prometheus }, { name: data, mountPath: /prometheus }]
      volumes:
        - { name: config, configMap: { name: prometheus-config } }
        - { name: data, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata: { name: grafana }
spec: { selector: { app.kubernetes.io/name: grafana }, ports: [{ port: 3000 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: grafana }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: grafana } }
  template:
    metadata: { labels: { app.kubernetes.io/name: grafana, app.kubernetes.io/part-of: coldguard, tier: monitoring } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 472, fsGroup: 472 }
      containers:
        - name: grafana
          image: grafana/grafana:11.4.0
          env:
            - { name: GF_SECURITY_ADMIN_USER, value: admin }
            - { name: GF_SECURITY_ADMIN_PASSWORD, valueFrom: { secretKeyRef: { name: coldguard-secrets, key: GRAFANA_ADMIN_PASSWORD } } }
            - { name: GF_USERS_ALLOW_SIGN_UP, value: "false" }
          ports: [{ containerPort: 3000 }]
          readinessProbe: { httpGet: { path: /api/health, port: 3000 }, periodSeconds: 10 }
          resources: { requests: { cpu: 50m, memory: 96Mi }, limits: { cpu: 500m, memory: 256Mi } }
          volumeMounts:
            - { name: datasources, mountPath: /etc/grafana/provisioning/datasources }
            - { name: providers, mountPath: /etc/grafana/provisioning/dashboards }
            - { name: dashboards, mountPath: /var/lib/grafana/dashboards }
      volumes:
        - { name: datasources, configMap: { name: grafana-datasources } }
        - { name: providers, configMap: { name: grafana-dashboard-providers } }
        - { name: dashboards, configMap: { name: grafana-dashboards } }
---
apiVersion: v1
kind: Service
metadata: { name: postgres-exporter }
spec: { selector: { app.kubernetes.io/name: postgres-exporter }, ports: [{ port: 9187 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: postgres-exporter }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: postgres-exporter } }
  template:
    metadata: { labels: { app.kubernetes.io/name: postgres-exporter, app.kubernetes.io/part-of: coldguard, tier: monitoring } }
    spec:
      containers:
        - name: exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.16.0
          env: [{ name: DATA_SOURCE_NAME, valueFrom: { secretKeyRef: { name: coldguard-secrets, key: EXPORTER_DSN } } }]
          ports: [{ containerPort: 9187 }]
          resources: { requests: { cpu: 10m, memory: 24Mi }, limits: { cpu: 200m, memory: 64Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: redis-exporter }
spec: { selector: { app.kubernetes.io/name: redis-exporter }, ports: [{ port: 9121 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: redis-exporter }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: redis-exporter } }
  template:
    metadata: { labels: { app.kubernetes.io/name: redis-exporter, app.kubernetes.io/part-of: coldguard, tier: monitoring } }
    spec:
      containers:
        - name: exporter
          image: oliver006/redis_exporter:v1.66.0
          env: [{ name: REDIS_ADDR, value: redis://redis:6379 }]
          ports: [{ containerPort: 9121 }]
          resources: { requests: { cpu: 10m, memory: 16Mi }, limits: { cpu: 100m, memory: 64Mi } }
