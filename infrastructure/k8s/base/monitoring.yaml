# Observability: Prometheus (pod discovery + kubelet/cAdvisor container metrics), Grafana
# (provisioned dashboards, persistent), kube-state-metrics (restarts / readiness), postgres and
# redis exporters. Clusters with kube-prometheus-stack can drop this file and rely on the pod
# prometheus.io/* annotations instead.
apiVersion: v1
kind: ServiceAccount
metadata: { name: prometheus }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: coldguard-prometheus }
rules:
  - apiGroups: [""]
    resources: [pods, endpoints, services, nodes, nodes/metrics]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [nodes/proxy]          # /api/v1/nodes/<node>/proxy/metrics/cadvisor
    verbs: [get]
  - nonResourceURLs: [/metrics]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: coldguard-prometheus }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: coldguard-prometheus }
subjects: [{ kind: ServiceAccount, name: prometheus, namespace: coldguard }]
---
apiVersion: v1
kind: Service
metadata: { name: prometheus }
spec: { selector: { app.kubernetes.io/name: prometheus }, ports: [{ name: http, port: 9090 }] }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: prometheus-data }
spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 5Gi } } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: prometheus }
spec:
  replicas: 1
  strategy: { type: Recreate }       # RWO volume: never two pods writing the same TSDB
  selector: { matchLabels: { app.kubernetes.io/name: prometheus } }
  template:
    metadata: { labels: { app.kubernetes.io/name: prometheus, app.kubernetes.io/part-of: coldguard, tier: monitoring } }
    spec:
      serviceAccountName: prometheus
      securityContext: { runAsNonRoot: true, runAsUser: 65534, fsGroup: 65534, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: prometheus
          image: prom/prometheus:v3.1.0
          args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d",
                 "--storage.tsdb.path=/prometheus"]
          ports: [{ containerPort: 9090, name: http }]
          readinessProbe: { httpGet: { path: /-/ready, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /-/healthy, port: http }, periodSeconds: 20, initialDelaySeconds: 30 }
          resources: { requests: { cpu: 50m, memory: 192Mi }, limits: { cpu: 500m, memory: 768Mi } }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: config, mountPath: /etc/prometheus }, { name: data, mountPath: /prometheus }]
      volumes:
        - { name: config, configMap: { name: prometheus-config } }
        - { name: data, persistentVolumeClaim: { claimName: prometheus-data } }
---
apiVersion: v1
kind: Service
metadata: { name: grafana }
spec: { selector: { app.kubernetes.io/name: grafana }, ports: [{ name: http, port: 3000 }] }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: grafana-data }
spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 1Gi } } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: grafana }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app.kubernetes.io/name: grafana } }
  template:
    metadata: { labels: { app.kubernetes.io/name: grafana, app.kubernetes.io/part-of: coldguard, tier: monitoring } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 472, fsGroup: 472, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: grafana
          image: grafana/grafana:11.4.0
          env:
            - { name: GF_SECURITY_ADMIN_USER, value: admin }
            - { name: GF_SECURITY_ADMIN_PASSWORD, valueFrom: { secretKeyRef: { name: coldguard-secrets, key: GRAFANA_ADMIN_PASSWORD } } }
            - { name: GF_USERS_ALLOW_SIGN_UP, value: "false" }
            - { name: GF_ANALYTICS_REPORTING_ENABLED, value: "false" }
            - { name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH, value: /var/lib/grafana/dashboards/coldguard-application.json }
          ports: [{ containerPort: 3000, name: http }]
          readinessProbe: { httpGet: { path: /api/health, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /api/health, port: http }, periodSeconds: 30, initialDelaySeconds: 30, failureThreshold: 5 }
          resources: { requests: { cpu: 50m, memory: 96Mi }, limits: { cpu: 500m, memory: 256Mi } }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: data, mountPath: /var/lib/grafana }
            - { name: datasources, mountPath: /etc/grafana/provisioning/datasources }
            - { name: providers, mountPath: /etc/grafana/provisioning/dashboards }
            - { name: dashboards, mountPath: /var/lib/grafana/dashboards }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: grafana-data } }
        - { name: datasources, configMap: { name: grafana-datasources } }
        - { name: providers, configMap: { name: grafana-dashboard-providers } }
        - { name: dashboards, configMap: { name: grafana-dashboards } }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: kube-state-metrics }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: coldguard-kube-state-metrics }
rules:
  - apiGroups: [""]
    resources: [pods, persistentvolumeclaims, services, namespaces]
    verbs: [list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, replicasets]
    verbs: [list, watch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: coldguard-kube-state-metrics }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: coldguard-kube-state-metrics }
subjects: [{ kind: ServiceAccount, name: kube-state-metrics, namespace: coldguard }]
---
apiVersion: v1
kind: Service
metadata: { name: kube-state-metrics }
spec: { selector: { app.kubernetes.io/name: kube-state-metrics }, ports: [{ name: http, port: 8080 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: kube-state-metrics }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: kube-state-metrics } }
  template:
    metadata: { labels: { app.kubernetes.io/name: kube-state-metrics, app.kubernetes.io/part-of: coldguard, tier: monitoring } }
    spec:
      serviceAccountName: kube-state-metrics
      securityContext: { runAsNonRoot: true, runAsUser: 65534, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.14.0
          args: ["--namespaces=coldguard",
                 "--resources=pods,deployments,statefulsets,jobs,persistentvolumeclaims,horizontalpodautoscalers"]
          ports: [{ containerPort: 8080, name: http }]
          readinessProbe: { httpGet: { path: /readyz, port: 8081 }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /livez, port: http }, periodSeconds: 20, initialDelaySeconds: 10 }
          resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { cpu: 200m, memory: 128Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
---
apiVersion: v1
kind: Service
metadata: { name: postgres-exporter }
spec: { selector: { app.kubernetes.io/name: postgres-exporter }, ports: [{ name: http, port: 9187 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: postgres-exporter }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: postgres-exporter } }
  template:
    metadata: { labels: { app.kubernetes.io/name: postgres-exporter, app.kubernetes.io/part-of: coldguard, tier: monitoring } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 65534, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.16.0
          env: [{ name: DATA_SOURCE_NAME, valueFrom: { secretKeyRef: { name: coldguard-secrets, key: EXPORTER_DSN } } }]
          ports: [{ containerPort: 9187, name: http }]
          readinessProbe: { httpGet: { path: /, port: http }, periodSeconds: 15 }
          livenessProbe: { httpGet: { path: /, port: http }, periodSeconds: 30, initialDelaySeconds: 10 }
          resources: { requests: { cpu: 10m, memory: 24Mi }, limits: { cpu: 200m, memory: 64Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
---
apiVersion: v1
kind: Service
metadata: { name: redis-exporter }
spec: { selector: { app.kubernetes.io/name: redis-exporter }, ports: [{ name: http, port: 9121 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: redis-exporter }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: redis-exporter } }
  template:
    metadata: { labels: { app.kubernetes.io/name: redis-exporter, app.kubernetes.io/part-of: coldguard, tier: monitoring } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 59000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: exporter
          image: oliver006/redis_exporter:v1.66.0
          env: [{ name: REDIS_ADDR, value: redis://redis:6379 }]
          ports: [{ containerPort: 9121, name: http }]
          readinessProbe: { httpGet: { path: /health, port: http }, periodSeconds: 15 }
          livenessProbe: { httpGet: { path: /health, port: http }, periodSeconds: 30, initialDelaySeconds: 10 }
          resources: { requests: { cpu: 10m, memory: 16Mi }, limits: { cpu: 100m, memory: 64Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
