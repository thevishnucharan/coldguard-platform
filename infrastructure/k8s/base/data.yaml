# Data tier: PostgreSQL (StatefulSet + PVC), Redis, Mosquitto MQTT broker.
# For production prefer a managed PostgreSQL: delete the postgres StatefulSet/Service and
# point DATABASE_URL (secret) at the external instance — see docs/DEPLOYMENT.md.
apiVersion: v1
kind: Service
metadata: { name: postgres, labels: { app.kubernetes.io/name: postgres } }
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: postgres }
  ports: [{ name: pg, port: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: postgres }
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: postgres } }
  template:
    metadata: { labels: { app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: coldguard, tier: data } }
    spec:
      securityContext: { fsGroup: 999 }
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{ containerPort: 5432, name: pg }]
          env:
            - { name: POSTGRES_USER, valueFrom: { secretKeyRef: { name: coldguard-secrets, key: POSTGRES_USER } } }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: coldguard-secrets, key: POSTGRES_PASSWORD } } }
            - { name: POSTGRES_DB, value: coldguard }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          readinessProbe: { exec: { command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d coldguard"] }, periodSeconds: 10, timeoutSeconds: 5 }
          # lenient: restarting a database because it is slow under load causes more harm than it fixes
          livenessProbe: { exec: { command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d coldguard"] }, periodSeconds: 20, timeoutSeconds: 10, failureThreshold: 6, initialDelaySeconds: 60 }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: "1", memory: 1Gi } }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 5Gi } } }
---
apiVersion: v1
kind: Service
metadata: { name: redis }
spec:
  selector: { app.kubernetes.io/name: redis }
  ports: [{ name: redis, port: 6379 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: redis }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: redis } }
  template:
    metadata: { labels: { app.kubernetes.io/name: redis, app.kubernetes.io/part-of: coldguard, tier: data } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 999, fsGroup: 999 }
      containers:
        - name: redis
          image: redis:7.4-alpine
          args: ["--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
          ports: [{ containerPort: 6379 }]
          readinessProbe: { exec: { command: ["redis-cli", "ping"] }, periodSeconds: 5 }
          livenessProbe: { tcpSocket: { port: 6379 }, periodSeconds: 15 }
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 500m, memory: 192Mi } }
          securityContext: { allowPrivilegeEscalation: false }
          volumeMounts: [{ name: data, mountPath: /data }]
      volumes: [{ name: data, persistentVolumeClaim: { claimName: redis-data } }]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: redis-data }
spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 1Gi } } }
---
apiVersion: v1
kind: Service
metadata: { name: mosquitto }
spec:
  selector: { app.kubernetes.io/name: mosquitto }
  ports: [{ name: mqtt, port: 1883 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: mosquitto }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app.kubernetes.io/name: mosquitto } }
  template:
    metadata: { labels: { app.kubernetes.io/name: mosquitto, app.kubernetes.io/part-of: coldguard, tier: data } }
    spec:
      containers:
        - name: mosquitto
          image: eclipse-mosquitto:2.0.20
          command: ["/bin/sh", "/config-src/entrypoint.sh"]
          env:
            - { name: MQTT_INGESTOR_PASSWORD, valueFrom: { secretKeyRef: { name: coldguard-secrets, key: MQTT_INGESTOR_PASSWORD } } }
            - { name: MQTT_DEVICE_PASSWORD, valueFrom: { secretKeyRef: { name: coldguard-secrets, key: MQTT_DEVICE_PASSWORD } } }
          ports: [{ containerPort: 1883 }]
          readinessProbe: { tcpSocket: { port: 1883 }, periodSeconds: 5 }
          livenessProbe: { tcpSocket: { port: 1883 }, periodSeconds: 15, initialDelaySeconds: 10 }
          resources: { requests: { cpu: 20m, memory: 16Mi }, limits: { cpu: 250m, memory: 64Mi } }
          volumeMounts:
            - { name: config-src, mountPath: /config-src, readOnly: true }
            - { name: data, mountPath: /mosquitto/data }
      volumes:
        - { name: config-src, configMap: { name: mosquitto-config } }
        - { name: data, emptyDir: {} }
