# Serves the SPA and reverse-proxies the API (same origin => no CORS, cookies/WS simple).
# BACKEND_UPSTREAM defaults to the compose/k8s service name "backend".
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  include /etc/nginx/snippets/security-headers.conf;

  location = /healthz { access_log off; return 200 "ok\n"; }

  location /api/v1/ws {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    client_max_body_size 2m;
    proxy_read_timeout 300s;   # long admin operations (demo reset, large exports)
  }

  # docs: own add_header stops inheritance of the strict SPA CSP (backend sends a docs-specific CSP)
  location = /docs { proxy_pass http://backend:8000; add_header X-Content-Type-Options nosniff always; }
  location = /openapi.json { proxy_pass http://backend:8000; add_header X-Content-Type-Options nosniff always; }

  location /assets/ { expires 1y; include /etc/nginx/snippets/security-headers.conf; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  location / { try_files $uri /index.html; include /etc/nginx/snippets/security-headers.conf; add_header Cache-Control "no-cache"; }
}
