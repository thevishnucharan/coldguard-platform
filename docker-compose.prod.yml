# Production overrides: no demo data/simulation, no direct API/DB/broker exposure except via
# nginx (8080, put TLS in front), stricter resources. Use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  migrate:
    command: ["sh", "-c", "python scripts/migrate.py"]
    environment: { ENVIRONMENT: production, DEMO_MODE: "false", SIMULATION_ENABLED: "false" }
  backend:
    ports: !reset []
    environment: { ENVIRONMENT: production, DEMO_MODE: "false", SIMULATION_ENABLED: "false", LOG_LEVEL: WARNING, BACKEND_CORS_ORIGINS: "${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN}" }
    deploy: { replicas: 1, resources: { limits: { cpus: "2.0", memory: 1G } } }
  worker:
    environment: { ENVIRONMENT: production, DEMO_MODE: "false", SIMULATION_ENABLED: "false", LOG_LEVEL: WARNING }
  frontend:
    build: { args: { VITE_SHOW_DEMO_LOGINS: "false" } }
  prometheus:
    ports: !reset []
  simulator:
    profiles: ["never"]
